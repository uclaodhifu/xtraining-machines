name: 训练器械识别模型
on:
  push:
    branches: [main]
    paths: ['照片/**', 'scripts/**', '.github/workflows/train.yml']
  workflow_dispatch:
concurrency: {group: train, cancel-in-progress: true}
permissions:
  contents: write
jobs:
  train:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/split.py
      - run: swift scripts/train.swift
      - name: 把模型和报告提交回仓库
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add 模型 && git commit -m "模型：自动训练（run ${{ github.run_id }}）[skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin main && git push origin HEAD:main && break; sleep 5; done
